name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Build Debug and Release APKs with R8
      run: gradle assembleDebug assembleRelease --stacktrace

    - name: Verify APK Size
      run: |
        echo "=== Generated APKs ==="
        find app/build/outputs/apk -name "*.apk" -exec ls -lh {} +
