name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle Dependencies & Distribution
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/transforms-3
          ~/.gradle/wrapper/dists
        key: gradle-unified-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
        restore-keys: |
          gradle-unified-${{ runner.os }}-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        cache-disabled: true

    - name: Build Debug and Release APKs with R8
      run: gradle assembleDebug assembleRelease --stacktrace

    - name: Verify APK Size
      run: |
        echo "=== Generated APKs ==="
        find app/build/outputs/apk -name "*.apk" -exec ls -lh {} +

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: streamytb-apks
        path: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Beta Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== Uploading APKs to Official Beta Release ==="
        gh release upload v1.0.0-beta.1 \
          app/build/outputs/apk/release/app-release.apk \
          app/build/outputs/apk/debug/app-debug.apk \
          --clobber
        echo "=== Release assets uploaded successfully! ==="
        gh release view v1.0.0-beta.1
